name: Java CI pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  # JOB 1: BUILD
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '25'

      - name: Build application
        run: mvn clean package -DskipTests


  # JOB 2: TEST
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '25'

      - name: Run tests
        run: mvn test


  # JOB 3: DEPLOY
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Deploy application
        run: echo "Deploying application..."
